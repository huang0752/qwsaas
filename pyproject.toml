[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwsaas"
version = "0.3.0"
description = "Private Python SDK for Juhe/QW SaaS enterprise WeChat integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10.0,<4",
  "boto3>=1.40.0,<2",
  "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10",
  "pytest-asyncio>=0.24.0,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwsaas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real: tests that call real Juhe/CDN/S3 services and are skipped unless explicitly enabled",
]
